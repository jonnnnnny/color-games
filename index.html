    <title>彩虹小课堂 · 颜色大冒险</title>
    <style>
      :root {
        --ink: #3c3653;

      /* ---------- 首页 · 模式选择 ---------- */

      .mode-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 148px; padding: 18px 16px 14px; border: 0; border-radius: 26px; color: #fff; cursor: pointer; text-align: left; overflow: hidden; transition: transform .12s ease, filter .18s ease; }

      .object.hidden-art { opacity: 0; transform: scale(.6) rotate(8deg); }

      .tone-art.art-sailboat { width: 26%; height: 68%; margin-top: 54%; border-radius: 5px; background: color-mix(in srgb, var(--tone) 55%, black); }
      .tone-art.art-sailboat::before { width: 0; height: 0; top: -88%; left: 16%; border-left: 34px solid transparent; border-bottom: 58px solid color-mix(in srgb, var(--tone) 86%, white); border-radius: 0; background: transparent; opacity: 1; transform: none; }
      .tone-art.art-sailboat::after { width: 0; height: 0; top: -30%; left: 54%; right: auto; bottom: auto; border-left: 24px solid transparent; border-bottom: 34px solid color-mix(in srgb, var(--tone) 70%, white); border-radius: 0; background: transparent; opacity: 1; transform: none; }
      .tone-art.art-eggplant { width: 44%; height: 60%; margin-top: 26%; border-radius: 42% 42% 44% 44% / 24% 24% 58% 58%; }
      .tone-art.art-eggplant::before { width: 30%; height: 24%; top: -24%; left: 36%; border-radius: 50% 50% 46% 46%; background: color-mix(in srgb, var(--tone) 58%, black); opacity: 1; transform: none; }
      .tone-art.art-eggplant::after { display: none; }
      .tone-art.art-cookie { border-radius: 50%; }
      .tone-art.art-cookie::before { width: 17%; height: 17%; top: 30%; left: 24%; border-radius: 50%; background: color-mix(in srgb, var(--tone) 44%, black); opacity: 1; transform: none; box-shadow: 26px 8px 0 color-mix(in srgb, var(--tone) 44%, black), 9px 30px 0 color-mix(in srgb, var(--tone) 44%, black), 31px 33px 0 color-mix(in srgb, var(--tone) 44%, black); }
      .tone-art.art-cookie::after { width: 24%; height: 24%; top: 6%; right: 12%; border-radius: 50%; background: color-mix(in srgb, var(--tone) 56%, black); opacity: 1; transform: none; }
      .tone-art.art-pencil { width: 20%; height: 62%; margin-top: 12%; border-radius: 5px; background: color-mix(in srgb, var(--tone) 74%, white); }
      .tone-art.art-pencil::before { width: 0; height: 0; top: auto; bottom: -18%; left: -16%; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 26px solid color-mix(in srgb, var(--tone) 40%, black); border-radius: 0; background: transparent; opacity: 1; transform: none; }
      .tone-art.art-pencil::after { width: 30px; height: 16%; top: -14%; left: 50%; right: auto; bottom: auto; border-radius: 4px; background: color-mix(in srgb, var(--tone) 58%, white); opacity: 1; transform: translateX(-50%); }
      .tone-art.art-egg { width: 56%; height: 70%; margin-top: 14%; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; box-shadow: 0 0 0 4px rgba(96,86,140,.15), inset -10px -12px 0 rgba(0,0,0,.08); }
      .tone-art.art-egg::before, .tone-art.art-egg::after { display: none; }

      /* ---------- 形状库（F-1.1） ---------- */
      .shape-art { --s-color: #7366dc; position: relative; display: block; width: 72%; height: 72%; }
      .shape-art.shape-circle { border-radius: 50%; background: var(--s-color); box-shadow: inset -10px -10px 0 rgba(0,0,0,.10), inset 8px 8px 0 rgba(255,255,255,.16); }
      .shape-art.shape-square { border-radius: 12%; background: var(--s-color); box-shadow: inset -10px -10px 0 rgba(0,0,0,.10), inset 8px 8px 0 rgba(255,255,255,.16); }
      .shape-art.shape-triangle { width: 0; height: 0; border-right: 51px solid transparent; border-bottom: 88px solid var(--s-color); border-left: 51px solid transparent; filter: drop-shadow(-4px 4px 0 rgba(0,0,0,.10)); }
      .shape-art.shape-star { background: var(--s-color); clip-path: polygon(50% 0, 63% 34%, 98% 35%, 70% 56%, 80% 90%, 50% 70%, 20% 90%, 30% 56%, 2% 35%, 37% 34%); filter: drop-shadow(0 5px 0 rgba(0,0,0,.10)); }
      .shape-art.shape-heart { width: 64%; height: 56%; margin-top: 16%; background: var(--s-color); border-radius: 5px 0 0 0; transform: rotate(45deg); box-shadow: none; }
      .shape-art.shape-heart::before, .shape-art.shape-heart::after { content: ""; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: var(--s-color); }
      .shape-art.shape-heart::before { top: -50%; left: 0; }
      .shape-art.shape-heart::after { top: 0; left: -50%; }
      .shape-art.shape-diamond { background: var(--s-color); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter: drop-shadow(0 5px 0 rgba(0,0,0,.10)); }

      /* ---------- 首页分区布局（F-1.4） ---------- */
      .home-section { margin-bottom: 20px; }
      .home-section-title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: clamp(16px, 4vw, 20px); font-weight: 900; color: var(--ink); }
      .home-section-title .sec-emoji { font-size: 24px; }
      .mode-grid-3 { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 2vw, 16px); }
      .mode-card.mc-shapes { background: linear-gradient(135deg, #f5a623, #e8853a); }
      .mode-card.mc-explore { background: linear-gradient(135deg, #ff6b9d, #e84393); grid-column: span 2; min-height: 100px; flex-direction: row; align-items: center; justify-content: center; gap: 12px; }
      .mode-card.mc-explore .mode-emoji { font-size: 30px; }
      .mode-card.mc-explore .mode-desc { max-width: 200px; }

      /* ---------- 自由探索模式（F-2.1） ---------- */
      .explore-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: clamp(12px, 2.5vw, 20px); margin-top: 16px; }
      .explore-card { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 130px; padding: 16px 10px; border: 3px solid rgba(255,255,255,.72); border-radius: 24px; background: #fff; box-shadow: 0 5px 0 rgba(68,54,102,.10); cursor: pointer; transition: transform .12s ease; user-select: none; -webkit-user-select: none; }
      .explore-card:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(68,54,102,.10); }
      .explore-card .explore-art { display: grid; place-items: center; width: 60px; height: 60px; }
      .explore-card .explore-label { font-size: 16px; font-weight: 900; color: var(--ink); }
      .explore-card.exp-color .explore-swatch { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset -6px -6px 0 rgba(0,0,0,.10), inset 5px 5px 0 rgba(255,255,255,.18); }
      .explore-card.exp-shape .shape-art { width: 48px; height: 48px; }
      .explore-card.exp-shape .shape-art.shape-triangle { border-right: 30px solid transparent; border-bottom: 52px solid var(--s-color); border-left: 30px solid transparent; }
      .explore-card.exp-shape .shape-art.shape-heart { width: 40px; height: 36px; margin-top: 6px; }
      .explore-card.pop { animation: pop .42s ease; }
      .explore-tabs { display: flex; gap: 8px; margin-top: 14px; }
      .explore-tab { padding: 8px 18px; border: 0; border-radius: 99px; font: inherit; font-size: 15px; font-weight: 900; color: var(--ink); background: #f0e8dd; cursor: pointer; transition: all .15s ease; }
      .explore-tab.active { color: #fff; background: var(--purple); }

      /* ---------- 启蒙模式（F-2.2） ---------- */
      .mode-card.mc-enlighten { background: linear-gradient(135deg, #fcb045, #fd7e5a); }
      .enlighten-celebrate { text-align: center; padding: 20px 0; }
      .enlighten-celebrate .big-emoji { font-size: 72px; animation: starPop .5s ease both; }
      .enlighten-celebrate h2 { margin: 12px 0 6px; font-size: clamp(28px, 6vw, 40px); font-weight: 1000; }
      .enlighten-celebrate p { margin: 0 0 20px; color: #6f667e; font-size: 18px; font-weight: 700; }

      /* ---------- 大元素触控（F-2.5） ---------- */
      .color-choice.large { min-height: 170px; border-radius: 32px; }

      /* ---------- 形状选项按钮 ---------- */
      .shape-choice { display: grid; place-items: center; }
      .shape-choice .shape-art { width: 56px; height: 56px; }
      .shape-choice .shape-art.shape-triangle { width: 0; height: 0; border-right: 32px solid transparent; border-bottom: 56px solid var(--s-color); border-left: 32px solid transparent; background: transparent; box-shadow: none; }
      .shape-choice .shape-art.shape-heart { width: 40px; height: 36px; margin-top: 6px; }
      @media (max-width: 500px) {
        .color-choice.large { min-height: 140px; }
        .explore-grid { grid-template-columns: repeat(2, 1fr); }
      }

      .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: clamp(11px, 2vw, 20px); margin-top: clamp(28px, 5vw, 42px); }
      .color-choice { position: relative; min-height: 136px; border: 3px solid rgba(255,255,255,.72); border-radius: 28px; cursor: pointer; box-shadow: inset 0 -9px 0 rgba(0,0,0,.13), 0 6px 0 rgba(65,53,87,.11); transition: transform .12s ease, filter .18s ease; user-select: none; -webkit-user-select: none; }
      .color-choice::after { content: ""; position: absolute; top: 12px; left: 16%; width: 42%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.34); transform: rotate(-18deg); }
      .color-choice.is-pale { box-shadow: inset 0 -9px 0 rgba(0,0,0,.06), 0 6px 0 rgba(65,53,87,.11), 0 0 0 3px rgba(95,85,130,.20); }
      .color-choice:hover { filter: brightness(1.04); }
      .color-choice:active { transform: translateY(6px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.13), 0 2px 0 rgba(65,53,87,.11); }
      .color-choice:focus-visible { outline: 4px solid #463b5b; outline-offset: 3px; }
      .color-choice.is-wrong { animation: wiggle .38s ease; filter: grayscale(.15) brightness(.82); }
      .color-choice.is-correct { animation: pop .42s ease; }
      .color-choice.odd-target { animation: odd-glow 1.1s ease-in-out infinite; }
      .color-choice.odd-target:hover { filter: brightness(1.1); }

      .hint { min-height: 1.5em; margin: 25px 0 0; text-align: center; color: #756b84; font-size: clamp(16px, 3.6vw, 19px); font-weight: 700; }
      .hint strong { color: var(--purple); }

      .finish, .level-complete { display: none; text-align: center; padding: 8px 0 4px; }
      .finish.show, .level-complete.show { display: block; animation: appear .35s ease both; }
      .level-complete h2 { margin: 8px 0; font-size: clamp(32px, 7vw, 48px); }
      .level-complete p { margin: 0 0 23px; color: #6f667e; font-size: 18px; font-weight: 700; }
      .finish h2 { margin: 6px 0; font-size: clamp(34px, 8vw, 52px); }
      .finish p { margin: 0 0 8px; color: #6f667e; font-size: 18px; font-weight: 700; }
      .award { font-size: 58px; letter-spacing: 3px; text-shadow: 0 3px 0 rgba(246,173,55,.35); }
      .award .star-cell { display: inline-block; animation: star-in .45s ease both; }
      .award .star-cell:nth-child(2) { animation-delay: .18s; }
      .award .star-cell:nth-child(3) { animation-delay: .36s; }
      .finish-stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
      .finish-stat { min-width: 84px; padding: 10px 14px; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 rgba(68,54,102,.10); }
      .finish-stat b { display: block; font-size: 22px; color: var(--purple); }
      .finish-stat span { font-size: 12px; color: #948aa3; font-weight: 800; }
      .badges { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 20px; }
      .badge-item { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; background: linear-gradient(135deg, #fff7e0, #ffeecf); border: 2px solid rgba(246,170,55,.4); color: #8a6a12; font-size: 14px; font-weight: 900; animation: appear .4s ease both; }
      .badge-item:nth-child(2) { animation-delay: .12s; }
      .badge-item:nth-child(3) { animation-delay: .24s; }
      .badge-item:nth-child(4) { animation-delay: .36s; }
      .badge-item:nth-child(5) { animation-delay: .48s; }
      .badge-item:nth-child(6) { animation-delay: .6s; }
      .restart-button { padding: 15px 28px; border: 0; border-radius: 18px; color: white; background: var(--purple); box-shadow: inset 0 -5px 0 rgba(48,35,98,.25), 0 5px 0 rgba(68,54,102,.13); cursor: pointer; font: inherit; font-size: 18px; font-weight: 900; }
      .restart-button:active, .next-level-button:active, .home-button:active { transform: translateY(4px); box-shadow: inset 0 -2px 0 rgba(48,35,98,.25), 0 1px 0 rgba(68,54,102,.13); }
      .next-level-button { padding: 15px 28px; border: 0; border-radius: 18px; color: white; background: #ef8b55; box-shadow: inset 0 -5px 0 rgba(133,67,36,.22), 0 5px 0 rgba(68,54,102,.13); cursor: pointer; font: inherit; font-size: 18px; font-weight: 900; }
      .home-button { padding: 15px 28px; border: 0; border-radius: 18px; color: var(--ink); background: #fff; box-shadow: inset 0 -5px 0 rgba(68,54,102,.12), 0 5px 0 rgba(68,54,102,.13); cursor: pointer; font: inherit; font-size: 18px; font-weight: 900; }
      .finish-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }

      .confetti, .burst { position: fixed; z-index: 3; pointer-events: none; }
      .confetti { top: -15px; width: 12px; height: 18px; border-radius: 3px; animation: fall 1.5s linear forwards; }
      .burst { border-radius: 50%; animation: fly .7s ease-out forwards; }
      .popup-text { position: fixed; z-index: 4; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: clamp(44px, 12vw, 76px); font-weight: 1000; color: #ff9f2e; text-shadow: 0 4px 0 rgba(255,255,255,.9), 0 8px 22px rgba(0,0,0,.16); pointer-events: none; animation: popup-rise .9s ease forwards; }

      @keyframes wiggle { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-9px) rotate(-2deg); } 75% { transform: translateX(9px) rotate(2deg); } }
      @keyframes pop { 50% { transform: scale(1.12) rotate(-3deg); } }
      @keyframes appear { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(720deg); opacity: 0; } }
      @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
      @keyframes popup-rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 34% { transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -130%) scale(.95); } }
      @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      @keyframes combo-pop { 40% { transform: scale(1.35) rotate(-4deg); } }
      @keyframes blink { 50% { opacity: .35; } }
      @keyframes odd-glow { 0%,100% { box-shadow: inset 0 -9px 0 rgba(0,0,0,.13), 0 6px 0 rgba(65,53,87,.11), 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: inset 0 -9px 0 rgba(0,0,0,.13), 0 6px 0 rgba(65,53,87,.11), 0 0 0 8px rgba(255,255,255,.55); } }
      @keyframes peek-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes ring-shrink { from { transform: scale(1); opacity: .38; } to { transform: scale(.55); opacity: 0; } }
      @keyframes starPop { 0% { opacity: 0; transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3) rotate(8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes drift { from { transform: translateX(-40px) scale(.75); } to { transform: translateX(calc(100vw + 120px)) scale(.75); } }

      @media (max-width: 500px) {
        .app { width: calc(100% - 20px); padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
        .brand { font-size: 18px; }
        .brand-mark { width: 36px; height: 36px; border-radius: 12px; }
        .sound-button { width: 44px; height: 44px; border-radius: 14px; }
        main { padding-top: 10px; }
        .game-card { padding: 18px 14px 22px; border-width: 3px; border-radius: 26px; }
        .mode-card { min-height: 128px; padding: 14px 14px 12px; }
        .mode-emoji { font-size: 28px; }
        .progress-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; font-size: 13px; margin-top: 12px; }
        .progress-track { height: 13px; }
        .stars { min-width: 48px; font-size: 15px; }
        .question { margin: 18px auto 12px; }
        .color-name { font-size: clamp(40px, 14vw, 58px); }
        .object { width: min(30vw, 116px); height: min(30vw, 116px); margin-top: 14px; border-radius: 30px; }
        .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
        .color-choice { min-height: clamp(82px, 24vw, 108px); border-radius: 22px; }
        .hint { margin-top: 18px; font-size: 16px; }
        .award { font-size: clamp(44px, 14vw, 60px); }
        .restart-button, .next-level-button, .home-button { width: 100%; min-height: 52px; }
        .back-button { width: 38px; height: 38px; }
      }
      @media (max-width: 360px) {
        .brand span:last-child { font-size: 16px; }
        .game-card { padding-inline: 11px; }
        .level-badge, .mode-badge { font-size: 12px; }
        .color-choice { min-height: 78px; }
        .mode-desc { font-size: 11px; }
      }
      @media (max-height: 620px) and (orientation: landscape) {
        .app { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
        main { padding-top: 6px; }
        .game-card { padding-block: 12px; }
        .question { margin: 8px auto; }
        .color-name { font-size: 36px; }
        .object { width: 74px; height: 74px; margin-top: 6px; border-width: 5px; border-radius: 22px; }
        .answers { margin-top: 10px; }
        .color-choice { min-height: 58px; }
        .hint { margin-top: 10px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="sky-decoration" aria-hidden="true">
      <div class="sun"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="hill hill-one"></div><div class="hill hill-two"></div>
    </div>
    <div class="app">
      <header>
        <div class="brand"><span class="brand-mark"></span><span>彩虹小课堂</span></div>
        <button class="sound-button" id="soundButton" type="button" aria-label="朗读题目">🔊</button>
      </header>
      <main>
        <section class="game-card" id="home" aria-live="polite">
          <h1 class="home-title">彩虹小课堂</h1>
          <p class="home-sub">选一种玩法，开始今天的学习之旅吧！</p>

          <div class="home-section">
            <h2 class="home-section-title"><span class="sec-emoji">🎨</span>颜色游戏</h2>
            <div class="mode-grid-3">
              <button class="mode-card mc-enlighten" data-mode="enlighten-color" type="button">
                <span class="mode-emoji">🐣</span>
                <span class="mode-name">颜色启蒙</span>
                <span class="mode-desc">2 种颜色，点一点学认色</span>
                <span class="mode-tag">2岁+</span>
              </button>
              <button class="mode-card mc-levels" data-mode="levels" type="button">
                <span class="mode-emoji">🌈</span>
                <span class="mode-name">经典闯关</span>
                <span class="mode-desc">4 关，认识 11 种颜色</span>
                <span class="mode-tag">新手推荐</span>
              </button>
              <button class="mode-card mc-memory" data-mode="memory" type="button">
                <span class="mode-emoji">🧠</span>
                <span class="mode-name">记忆挑战</span>
                <span class="mode-desc">看 3 秒，凭记忆找颜色</span>
                <span class="mode-tag">锻炼记忆力</span>
              </button>
              <button class="mode-card mc-timed" data-mode="timed" type="button">
                <span class="mode-emoji">⚡</span>
                <span class="mode-name">限时冲刺</span>
                <span class="mode-desc">60 秒快速答题</span>
                <span class="mode-tag">高手对决</span>
              </button>
              <button class="mode-card mc-odd" data-mode="odd" type="button">
                <span class="mode-emoji">👀</span>
                <span class="mode-name">找不同</span>
                <span class="mode-desc">找出颜色不一样的那块</span>
                <span class="mode-tag">火眼金睛</span>
              </button>
            </div>
          </div>

          <div class="home-section">
            <h2 class="home-section-title"><span class="sec-emoji">🔷</span>形状游戏</h2>
            <div class="mode-grid-3">
              <button class="mode-card mc-enlighten" data-mode="enlighten-shape" type="button">
                <span class="mode-emoji">🐣</span>
                <span class="mode-name">形状启蒙</span>
                <span class="mode-desc">2 种形状，点一点学认形</span>
                <span class="mode-tag">2岁+</span>
              </button>
              <button class="mode-card mc-shapes" data-mode="shapes" type="button">
                <span class="mode-emoji">🔷</span>
                <span class="mode-name">形状闯关</span>
                <span class="mode-desc">3 关，认识 6 种形状</span>
                <span class="mode-tag">新手推荐</span>
              </button>
            </div>
          </div>

          <div class="home-section">
            <button class="mode-card mc-explore" data-mode="explore" type="button">
              <span class="mode-emoji">✨</span>
              <span class="mode-name">自由探索</span>
              <span class="mode-desc">点一点颜色和形状，听声音、看动画，无压力自由学</span>
              <span class="mode-tag">2岁+ 自由玩</span>
            </button>
          </div>
        </section>

        <section class="game-card" id="play" aria-live="polite" hidden>
          <div class="play-head">
            <button class="back-button" id="backButton" type="button" aria-label="返回模式选择">←</button>
            <span class="mode-badge" id="modeBadge">经典闯关</span>
            <span class="hud-spacer"></span>

    <script>
      const colors = [

      /* ---------- 形状库（F-1.1） ---------- */

      ];
      const shapeByName = new Map(shapes.map(s => [s.name, s]));

      /* ---------- 形状-物体关联（F-1.5） ---------- */
      const shapeObjects = {
        '圆形': ['太阳', '皮球', '车轮', '钟表', '甜甜圈'],
        '方形': ['窗户', '盒子', '手帕', '饼干', '图画'],

      const artPool = [

      const levels = [

        { name: '颜色探险', rounds: 4, choices: 3, palette: ['红色', '橙色', '黄色', '绿色', '蓝色', '粉色'], message: '好多颜色都难不倒你！' },
        { name: '颜色大师', rounds: 5, choices: 4, palette: ['红色', '橙色', '黄色', '绿色', '青色', '蓝色', '紫色', '粉色', '棕色'], message: '你是小小颜色大师！' },
        { name: '颜色魔法', rounds: 6, choices: 4, palette: colors.map(c => c.name), message: '恭喜通关！你是颜色魔法师！' }
      ];
      const totalRounds = levels.reduce((s, l) => s + l.rounds, 0);

      const MODES = {
        levels: { name: '经典闯关', emoji: '🌈', color: '#7366dc' },
        memory: { name: '记忆挑战', emoji: '🧠', color: '#ef7d64' },

        'enlighten-color': { name: '颜色启蒙', emoji: '🐣', color: '#fd7e5a' },
        'enlighten-shape': { name: '形状启蒙', emoji: '🐣', color: '#fd7e5a' },
        explore: { name: '自由探索', emoji: '✨', color: '#e84393' }
      };

      let mode = 'levels';
      let levelIndex = 0, questionInLevel = 0, round = 0;
      let score = 0, combo = 0, bestCombo = 0, lives = 3, wrongCount = 0, levelStartWrong = 0;
      let levelStars = [];
      let deck = [], oddDeck = [], currentItem, currentColor;
      let locked = false, timerId = null, timeLeft = 60, memoryTimer = null;
      let soundEnabled = true;

      const el = {
        home: document.getElementById('home'), play: document.getElementById('play'),
        modeBadge: document.getElementById('modeBadge'), backButton: document.getElementById('backButton'),
        livesText: document.getElementById('livesText'), timerText: document.getElementById('timerText'),

        progressRow: document.getElementById('progressRow'), roundText: document.getElementById('roundText'),
        progressFill: document.getElementById('progressFill'), starsText: document.getElementById('starsText'),

        statScore: document.getElementById('statScore'), statCombo: document.getElementById('statCombo'),
        statLives: document.getElementById('statLives'), badges: document.getElementById('badges'),
        restartButton: document.getElementById('restartButton'), homeButton: document.getElementById('homeButton'),
        soundButton: document.getElementById('soundButton')
      };

      /* ---------- 进度保存（F-2.6） ---------- */
      const STORAGE_KEY = 'color-games-progress';
      function loadProgress() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
      }
      function saveProgress(data) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }
      function recordMastery(type, name, correct) {
        const p = loadProgress();
        if (!p.mastery) p.mastery = {};
        const key = `${type}:${name}`;
        if (!p.mastery[key]) p.mastery[key] = { correct: 0, total: 0 };
        p.mastery[key].total += 1;
        if (correct) p.mastery[key].correct += 1;
        saveProgress(p);
      }
      function isMastered(type, name) {
        const p = loadProgress();
        const m = p.mastery && p.mastery[`${type}:${name}`];
        return m && m.total >= 3 && m.correct / m.total >= 0.8;
      }

      function shuffled(list) { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
      function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

      /* ---------- 音频 ---------- */
      let audioCtx = null;
      function ensureAudio() {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          // iOS/iPadOS: AudioContext 默认 suspended，必须在用户手势中 resume 才能出声
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
        try {
          // 预热语音列表，避免 iOS 首次调用无声
          if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); pickZhVoice(); }
        } catch (e) {}
      }
      // 在用户手势中解锁音频（iOS 要求）
      ['pointerdown', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, ensureAudio, { passive: true });
      });

      // 中文语音选择（iOS 只设 lang 不可靠，需显式指定 voice）
      let zhVoice = null;
      function pickZhVoice() {
        try {
          const vs = window.speechSynthesis.getVoices() || [];
          zhVoice = vs.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf('zh') === 0; })
            || vs.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf('cmn') === 0; })
            || null;
        } catch (e) { zhVoice = null; }
      }
      if ('speechSynthesis' in window) {
        pickZhVoice();
        try { window.speechSynthesis.onvoiceschanged = pickZhVoice; } catch (e) {}
      }

      function tone(freq, dur, type = 'sine', delay = 0, vol = .08) {
        if (!soundEnabled) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const t = audioCtx.currentTime + delay;
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = type; o.frequency.value = freq;
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(.001, t + dur);
          o.connect(g).connect(audioCtx.destination);
          o.start(t); o.stop(t + dur);
        } catch (e) {}
      }
      function playCorrect() { tone(523, .13); tone(659, .13, 'sine', .11); tone(784, .24, 'sine', .22); }
      function playWrong() { tone(180, .17, 'triangle'); }
      function playTick() { tone(920, .06, 'square', 0, .04); }
      function playTimeUp() { tone(392, .18, 'triangle'); tone(330, .2, 'triangle', .16); tone(262, .3, 'triangle', .34); }
      function playCombo(n) { tone(660 + n * 40, .12, 'sine', 0, .06); tone(880 + n * 40, .14, 'sine', .09); }

      function speak(text) {
        if (!soundEnabled || !('speechSynthesis' in window)) return;
        try {
          const synth = window.speechSynthesis;
          synth.cancel();
          // iOS: cancel 后立即 speak 可能被吞掉，延迟一小会再播
          setTimeout(function () {
            if (!soundEnabled) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN'; u.rate = .82; u.pitch = 1.18;
            if (zhVoice) u.voice = zhVoice;
            synth.speak(u);
          }, 60);
        } catch (e) {}
      }
      function stopSpeech() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }

      /* ---------- 粒子特效 ---------- */
      function spawnBurst(x, y, count = 18) {
        const palette = colors.map(c => c.hex);
        for (let i = 0; i < count; i++) {
          const p = document.createElement('i');
          p.className = 'burst';
          const size = 6 + Math.random() * 10;
          p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${pick(palette)};`;
          const angle = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 80;
          p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          p.style.setProperty('--dy', `${Math.sin(angle) * dist - 30}px`);
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 750);
        }
      }
      function confettiBurst() {
        const palette = colors.map(c => c.hex);
        for (let i = 0; i < 46; i++) {
          const p = document.createElement('i'); p.className = 'confetti';
          p.style.left = `${Math.random() * 100}vw`;
          p.style.background = palette[i % palette.length];
          p.style.setProperty('--drift', `${(Math.random() - .5) * 220}px`);
          p.style.animationDelay = `${Math.random() * .4}s`;
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 2200);
        }
      }
      function popupText(text) {
        const p = document.createElement('div');
        p.className = 'popup-text'; p.textContent = text;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 950);
      }

      /* ---------- 答题选项 ---------- */
      function makeChoices(answer, count, palette) {
        const pool = palette ? colors.filter(c => palette.includes(c.name)) : colors;
        const others = shuffled(pool.filter(c => c.name !== answer.name)).slice(0, count - 1);
        return shuffled([answer, ...others]);
      }
      function renderChoices(choices, onClick) {
        el.answers.innerHTML = '';
        choices.forEach(color => {
          const btn = document.createElement('button');
          btn.className = 'color-choice' + (color.pale ? ' is-pale' : '');
          btn.type = 'button'; btn.style.background = color.hex;
          btn.setAttribute('aria-label', color.name); btn.dataset.color = color.name;
          btn.addEventListener('click', e => onClick(color, btn, e));
          el.answers.appendChild(btn);
        });
      }

      /* ---------- 题目渲染 ---------- */
      function renderItem(showName = true) {
        const item = currentItem, color = currentColor;
        el.colorName.textContent = color.name.split('').join(' ');
        el.colorName.style.color = color.hex;
        el.colorName.style.opacity = showName ? '' : '0';
        el.colorName.classList.toggle('blurred', !showName);
        el.object.className = `tone-art ${item.art}`;
        el.object.style.setProperty('--tone', color.hex);
        el.objectBox.classList.toggle('hidden-art', !showName);
        el.objectBox.classList.toggle('peek', showName && mode === 'memory');
      }
      function updateHud() {
        el.scoreText.textContent = `⭐ ${score}`;
        el.comboText.hidden = combo < 2;
        if (combo >= 2) el.comboText.textContent = `🔥 x${combo}`;

          el.timerText.textContent = `${timeLeft}`;
          el.timerText.classList.toggle('danger', timeLeft <= 10);

      function renderLives() {
        el.livesText.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
        el.livesText.classList.toggle('one', lives === 1);
      }
      function renderProgress() {
        const level = levels[levelIndex];
        const position = Math.min(round + 1, totalRounds);
        el.roundText.textContent = `第 ${position} / ${totalRounds} 题`;
        el.progressFill.style.width = `${(position / totalRounds) * 100}%`;
        el.starsText.textContent = `★ ${levelStars.reduce((a, b) => a + b, 0)}`;

      /* ---------- 模式入口 ---------- */
      document.querySelectorAll('.mode-card').forEach(card => {
        card.addEventListener('click', () => startMode(card.dataset.mode));

      function startMode(key) {
        mode = key;
        el.home.hidden = true; el.play.hidden = false;
        el.finish.classList.remove('show'); el.levelComplete.classList.remove('show');
        el.gameArea.hidden = true;
        document.getElementById('exploreArea').hidden = true;

        document.getElementById('enlightenCelebrate').hidden = true;
        el.modeBadge.textContent = `${MODES[key].emoji} ${MODES[key].name}`;
        stopSpeech(); stopTimer();
        if (key === 'levels') { el.gameArea.hidden = false; startLevels(); }
        else if (key === 'memory') { el.gameArea.hidden = false; startMemory(); }
        else if (key === 'timed') { el.gameArea.hidden = false; startTimed(); }
        else if (key === 'odd') { el.gameArea.hidden = false; startOdd(); }
        else if (key === 'shapes') { el.gameArea.hidden = false; startShapes(); }

      /* ===== 模式一：经典闯关 ===== */
      function startLevels() {

      function buildLevelDeck() {

        // 每个颜色随机取 1 个物体，保证同关内物体不重复
        const byColor = new Map();
        pool.forEach(it => {
          if (!byColor.has(it.color)) byColor.set(it.color, []);
          byColor.get(it.color).push(it);
        });
        const picks = [];
        shuffled(level.palette).forEach(c => {
          const list = byColor.get(c) || [];
          if (list.length) picks.push(pick(list));
        });
        deck = shuffled(picks).slice(0, level.rounds);
        questionInLevel = 0;
        levelStartWrong = wrongCount;

      /* ---------- 结算 ---------- */
      function starsFor(modeKey) {
        if (modeKey === 'timed') {
          if (score >= 25) return 3;
          if (score >= 15) return 2;
          return 1;
        }
        if (modeKey === 'shapes') {
          if (wrongCount === 0) return 3;
          if (wrongCount <= 2) return 2;
          return 1;
        }
        if (wrongCount === 0) return 3;
        if (wrongCount <= 2) return 2;
        return 1;
      }
      function starRow(n) { return Array.from({ length: 3 }, (_, i) => `<span class="star-cell">${i < n ? '★' : '☆'}</span>`).join(''); }

        stopTimer(); stopSpeech();
        el.gameArea.hidden = true;

        document.getElementById('enlightenCelebrate').hidden = true;
        const useShapeStars = mode === 'shapes';
        const stars = useShapeStars
          ? Math.max(...(shapeLevelStars.length ? shapeLevelStars : [starsFor(mode)]))
          : (mode === 'levels' ? Math.max(...(levelStars.length ? levelStars : [starsFor(mode)])) : starsFor(mode));
        const perfect = mode === 'timed' ? score >= 25 : wrongCount === 0;
        const title = lives > 0 ? '太棒啦！' : '差一点点！';

          el.badges.appendChild(tag);

        confettiBurst();
        speak(`游戏结束，你得了 ${score} 分！`);

      function collectBadges(stars) {

        return list;

        document.getElementById('exploreTabShape').classList.add('active');
        document.getElementById('exploreTabColor').classList.remove('active');
        renderExploreGrid();
      });

      /* ===== 模式七：启蒙模式（F-2.2, F-2.3, F-2.4） ===== */
      let enlightenType = 'color';
      let enlightenQueue = [];
      let enlightenIndex = 0;

      function startEnlighten(type) {
        enlightenType = type;
        enlightenIndex = 0;
        score = 0; combo = 0; bestCombo = 0; wrongCount = 0;
        el.livesText.hidden = true; el.timerText.hidden = true; el.progressRow.hidden = true; el.comboText.hidden = true;
        el.scoreText.textContent = '⭐ 0';

        if (type === 'color') {
          enlightenQueue = [
            { name: '红色', hex: '#ef6b67', art: 'art-apple', noun: '苹果' },
            { name: '黄色', hex: '#f4cd4e', art: 'art-star', noun: '星星' },
            { name: '蓝色', hex: '#5a9fe0', art: 'art-fish', noun: '小鱼' },
            { name: '绿色', hex: '#6dbf6e', art: 'art-tree', noun: '大树' }
          ];
          document.getElementById('enlightenBadge').textContent = '颜色启蒙';
        } else {
          enlightenQueue = [
            { name: '圆形', cls: 'shape-circle', color: '#5a9fe0' },
            { name: '方形', cls: 'shape-square', color: '#f59a45' },
            { name: '三角形', cls: 'shape-triangle', color: '#6dbf6e' },
            { name: '星形', cls: 'shape-star', color: '#f4cd4e' }
          ];
          document.getElementById('enlightenBadge').textContent = '形状启蒙';
        }
        document.getElementById('enlightenCelebrate').hidden = true;
        document.getElementById('enlightenArea').hidden = false;
        renderEnlightenQuestion();
      }

      function renderEnlightenQuestion() {
        if (enlightenIndex >= enlightenQueue.length) {
          showEnlightenFinish();
          return;
        }
        const item = enlightenQueue[enlightenIndex];
        const nameEl = document.getElementById('enlightenName');
        const objBox = document.getElementById('enlightenObjectBox');
        const obj = document.getElementById('enlightenObject');
        const answersEl = document.getElementById('enlightenAnswers');
        const hintEl = document.getElementById('enlightenHint');

        if (enlightenType === 'color') {
          nameEl.textContent = item.name.split('').join(' ');
          nameEl.style.color = item.hex;
          obj.className = `tone-art ${item.art}`;
          obj.style.setProperty('--tone', item.hex);
          objBox.classList.remove('hidden-art');
          hintEl.innerHTML = `点一点<strong>${item.name}</strong>吧！`;
          // 1 选 1：只有一个选项，点击即正确
          answersEl.innerHTML = '';
          const btn = document.createElement('button');
          btn.className = 'color-choice large';
          btn.type = 'button';
          btn.style.background = item.hex;
          if (item.name === '白色' || item.name === '黄色') btn.classList.add('is-pale');
          btn.addEventListener('click', e => onEnlightenPick(item, btn, e));
          answersEl.appendChild(btn);
          setTimeout(() => speak(`这是${item.name}，点一点${item.name}吧`), 200);
        } else {
          nameEl.textContent = item.name.split('').join(' ');
          nameEl.style.color = item.color;
          obj.className = `shape-art ${item.cls}`;
          obj.style.setProperty('--s-color', item.color);
          objBox.classList.remove('hidden-art');
          hintEl.innerHTML = `点一点<strong>${item.name}</strong>吧！`;
          answersEl.innerHTML = '';
          const btn = document.createElement('button');
          btn.className = 'color-choice large';
          btn.type = 'button';
          btn.style.background = '#f5f1fa';
          const art = document.createElement('span');
          art.className = `shape-art ${item.cls}`;
          art.style.setProperty('--s-color', item.color);
          art.style.width = '50%';
          art.style.height = '50%';
          btn.appendChild(art);
          btn.addEventListener('click', e => onEnlightenPick(item, btn, e));
          answersEl.appendChild(btn);
          setTimeout(() => speak(`这是${item.name}，点一点${item.name}吧`), 200);
        }
      }

      function onEnlightenPick(item, btn, e) {
        btn.classList.add('is-correct'); playCorrect(); playCombo(1);
        spawnBurst(e.clientX, e.clientY, 24);
        confettiBurst();
        score += 1;
        el.scoreText.textContent = `⭐ ${score}`;
        const hintEl = document.getElementById('enlightenHint');
        if (enlightenType === 'color') {
          hintEl.innerHTML = `<strong>太棒啦！</strong>这是${item.name}！`;
          speak(`太棒啦！这是${item.name}`);
          recordMastery('color', item.name, true);
        } else {
          hintEl.innerHTML = `<strong>太棒啦！</strong>这是${item.name}！`;
          speak(`太棒啦！这是${item.name}`);
          recordMastery('shape', item.name, true);
        }
        document.querySelectorAll('#enlightenAnswers .color-choice').forEach(c => c.disabled = true);
        enlightenIndex += 1;
        setTimeout(() => renderEnlightenQuestion(), 1200);
      }

      function showEnlightenFinish() {
        document.getElementById('enlightenArea').hidden = true;
        const celebrate = document.getElementById('enlightenCelebrate');
        const title = document.getElementById('enlightenCelebrateTitle');
        const text = document.getElementById('enlightenCelebrateText');
        const nextBtn = document.getElementById('enlightenNextButton');
        celebrate.hidden = false;
        confettiBurst();
        if (enlightenType === 'color') {
          title.textContent = '太棒啦！';
          text.textContent = `你认识了 ${enlightenQueue.length} 种颜色！`;
          speak(`太棒啦！你认识了${enlightenQueue.length}种颜色！`);
          nextBtn.textContent = '再学一次';
          nextBtn.onclick = () => { celebrate.hidden = true; document.getElementById('enlightenArea').hidden = false; startEnlighten('color'); };
        } else {
          title.textContent = '太棒啦！';
          text.textContent = `你认识了 ${enlightenQueue.length} 种形状！`;
          speak(`太棒啦！你认识了${enlightenQueue.length}种形状！`);
          nextBtn.textContent = '再学一次';
          nextBtn.onclick = () => { celebrate.hidden = true; document.getElementById('enlightenArea').hidden = false; startEnlighten('shape'); };
        }
      }
      document.getElementById('enlightenHomeButton').addEventListener('click', goHome);
      function goHome() {
        stopTimer(); stopSpeech();
        el.finish.classList.remove('show'); el.levelComplete.classList.remove('show');
        el.gameArea.hidden = false;
        document.getElementById('exploreArea').hidden = true;
        document.getElementById('enlightenArea').hidden = true;
        document.getElementById('enlightenCelebrate').hidden = true;
        el.play.hidden = true; el.home.hidden = false;
      }
      function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
      function stopMemory() { if (memoryTimer) { clearTimeout(memoryTimer); memoryTimer = null; } }

      el.soundButton.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        el.soundButton.textContent = soundEnabled ? '🔊' : '🔇';
        el.soundButton.setAttribute('aria-label', soundEnabled ? '关闭声音' : '打开声音');
        if (soundEnabled && mode === 'levels') speak(`请选择 ${currentColor.name}`);
      });
    </script>
  </body>
</html>
